# Catalog service CI (stub).
#
# Catalog is still a hello-world, so this only type-checks / builds the
# TypeScript. It graduates to the booking pattern (Dockerfile `test` stage
# run against a live datastore) once catalog has a Dockerfile and real
# tests -- at which point this file gets renamed to
# catalog-build-and-test.yaml.
#
# GitHub Actions has no native workflow `description:` field; this comment
# is the description.

name: catalog

on:
  pull_request:
    paths:
      - "services/catalog/**"
      - ".github/workflows/catalog-build.yaml"
  push:
    branches: [main]
    paths:
      - "services/catalog/**"
      - ".github/workflows/catalog-build.yaml"

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/catalog/package-lock.json
      - run: npm ci
      - run: npm run build
