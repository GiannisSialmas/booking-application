# Discovery service CI (stub).
#
# Discovery is still a hello-world, so this only vets / builds the Go code.
# It graduates to the booking pattern (Dockerfile `test` stage run against
# a live datastore) once discovery has a Dockerfile and real tests -- at
# which point this file gets renamed to discovery-build-and-test.yaml.
#
# GitHub Actions has no native workflow `description:` field; this comment
# is the description.

name: discovery

on:
  pull_request:
    paths:
      - "services/discovery/**"
      - ".github/workflows/discovery-build.yaml"
  push:
    branches: [main]
    paths:
      - "services/discovery/**"
      - ".github/workflows/discovery-build.yaml"

concurrency:
  group: discovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false  # no go.sum yet -- no third-party deps
      - run: go vet ./...
      - run: go build ./...
