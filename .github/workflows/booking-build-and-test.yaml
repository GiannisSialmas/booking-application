# Booking service CI.
#
# Builds the Dockerfile's `test` stage and runs it (Alembic migrations,
# then pytest) against a real Postgres service container -- so the tests
# execute inside the same base image / Python / locked dependencies as the
# shipped artifact, not against raw source on the runner. Then builds the
# `runtime` stage to prove the deployable image builds. Nothing is pushed.
#
# GitHub Actions has no native workflow `description:` field; this comment
# is the description.

name: booking-build-and-test

on:
  pull_request:
    paths:
      - "services/booking/**"
      - ".github/workflows/booking-build-and-test.yaml"
  push:
    branches: [main]
    paths:
      - "services/booking/**"
      - ".github/workflows/booking-build-and-test.yaml"

concurrency:
  group: booking-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the test-stage image. Shares the builder stage's cached layers
      # (uv sync) with the runtime build below via the same gha cache scope.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: services/booking
          target: test
          load: true
          tags: booking:test
          cache-from: type=gha,scope=booking
          cache-to: type=gha,scope=booking,mode=max

      # Run the real artifact: migrations then pytest, against the Postgres
      # service container. --network host so the container reaches it on
      # localhost:5432 (the port the service maps onto the runner).
      - name: Migrate and test
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgresql+psycopg://booking:booking@localhost:5432/booking" \
            booking:test \
            sh -c "alembic upgrade head && pytest"

      # Prove the shipped image builds. Not pushed anywhere yet.
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: services/booking
          target: runtime
          tags: booking:runtime
          cache-from: type=gha,scope=booking
